<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comeback Thermometer</title>
  <meta name="description" content="How strong is each new TWICE, NMIXX or tripleS launch at day 1, 7 and 28, compared with the same artist's earlier launches in the same market?">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="title-row">
        <h1 data-i18n="title">Comeback Thermometer</h1>
        <button id="lang" type="button" class="lang" aria-label="Español">ES</button>
      </div>
      <p class="question" data-i18n="question"></p>
      <p class="asof"><span data-i18n="asof"></span> <strong id="snapshot-date">…</strong></p>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-explore" aria-selected="true" aria-controls="explore" data-i18n="tab_explore"></button>
      <button type="button" role="tab" id="tab-compare" aria-selected="false" aria-controls="compare" data-i18n="tab_compare"></button>
    </nav>

    <section class="controls" aria-label="Filters">
      <label id="pick-a-wrap">
        <span data-i18n="artist"></span>
        <select id="pick-a"></select>
      </label>
      <label id="pick-b-wrap" hidden>
        <span data-i18n="versus"></span>
        <select id="pick-b"></select>
      </label>
      <div class="market" role="radiogroup" aria-labelledby="market-label">
        <span id="market-label" data-i18n="market"></span>
        <button type="button" role="radio" data-market="all" aria-checked="true" data-i18n="all_markets"></button>
        <button type="button" role="radio" data-market="kr" aria-checked="false" data-i18n="kr"></button>
        <button type="button" role="radio" data-market="jp" aria-checked="false" data-i18n="jp"></button>
      </div>
    </section>

    <div id="explore" role="tabpanel" aria-labelledby="tab-explore">
      <section aria-label="Summary"><div class="tiles" id="tiles"></div></section>

      <section aria-labelledby="timeline-title">
        <h2 id="timeline-title" data-i18n="timeline_title"></h2>
        <p class="note" data-i18n="timeline_note"></p>
        <div class="chart-card">
          <ul class="legend" id="timeline-legend"></ul>
          <div class="chart" id="timeline"></div>
        </div>
      </section>

      <section aria-labelledby="curves-title">
        <h2 id="curves-title" data-i18n="curves_title"></h2>
        <p class="note" id="curves-note"></p>
        <div class="chart-card" id="curves-card">
          <ul class="legend" id="curves-legend"></ul>
          <div class="chart" id="curves"></div>
        </div>
      </section>

      <section aria-labelledby="ranked-title">
        <h2 id="ranked-title" data-i18n="ranked_title"></h2>
        <p class="note" id="ranked-note"></p>
        <div class="table-wrap">
          <table id="ranked">
            <thead>
              <tr>
                <th scope="col" data-i18n="col_video"></th>
                <th scope="col" data-i18n="col_released"></th>
                <th scope="col" class="num" data-i18n="col_d1"></th>
                <th scope="col" class="num" data-i18n="col_d7"></th>
                <th scope="col" class="num" data-i18n="col_d28"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="earlier-title">
        <h2 id="earlier-title" data-i18n="earlier_title"></h2>
        <p class="note" data-i18n="earlier_note"></p>
        <details class="table-details">
          <summary id="earlier-summary"></summary>
          <div class="table-wrap">
            <table id="earlier">
              <thead>
                <tr>
                  <th scope="col" data-i18n="col_video"></th>
                  <th scope="col" data-i18n="col_released"></th>
                  <th scope="col" class="num" data-i18n="col_age"></th>
                  <th scope="col" class="num" data-i18n="col_views"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </details>
      </section>

      <section aria-labelledby="lastfm-title">
        <h2 id="lastfm-title" data-i18n="lastfm_title"></h2>
        <dl class="stats" id="lastfm"></dl>
      </section>
    </div>

    <div id="compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
      <section aria-label="Comparison"><div class="versus" id="versus"></div></section>

      <section aria-labelledby="peryear-title">
        <h2 id="peryear-title" data-i18n="peryear_title"></h2>
        <p class="note" data-i18n="peryear_note"></p>
        <div class="chart-card">
          <ul class="legend" id="peryear-legend"></ul>
          <div class="chart" id="peryear"></div>
        </div>
        <details class="table-details">
          <summary data-i18n="as_table"></summary>
          <div class="table-wrap"><table id="peryear-table"></table></div>
        </details>
      </section>

      <section aria-labelledby="overlay-title">
        <h2 id="overlay-title" data-i18n="overlay_title"></h2>
        <p class="note" data-i18n="timeline_note"></p>
        <div class="chart-card">
          <ul class="legend" id="overlay-legend"></ul>
          <div class="chart" id="overlay"></div>
        </div>
      </section>
    </div>

    <section aria-labelledby="scope-title" class="scope">
      <h2 id="scope-title" data-i18n="scope_title"></h2>
      <ul id="scope"></ul>
    </section>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>

  <footer class="wrap foot">
    <p data-i18n="footer_data"></p>
    <p>
      <a href="https://github.com/dataengileb/kpop-comeback-thermometer" data-i18n="footer_repo"></a> ·
      <span data-i18n="footer_sources"></span>
      <a href="https://developers.google.com/youtube/v3">YouTube Data API</a>,
      <a href="https://www.last.fm/api">Last.fm</a>,
      <a href="https://musicbrainz.org/">MusicBrainz</a>
    </p>
  </footer>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
